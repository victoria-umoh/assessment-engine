name: lms

services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  judge0:
    image: judge0/judge0:1.13.1
    ports: ["2358:2358"]
    privileged: true
    platform: linux/amd64
    environment: &judge0-env
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0-local-pw
      ENABLE_NETWORK: "false"
    depends_on: [judge0-db, judge0-redis]

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    privileged: true
    platform: linux/amd64
    environment: *judge0-env
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0-local-pw
    volumes: [judge0-db-data:/var/lib/postgresql/data]

  judge0-redis:
    image: redis:7-alpine

  # Application services — opt in with `--profile app` (dev usually runs these
  # from source via `pnpm dev`; the profile is for a full containerized stack).
  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      MONGO_URI: mongodb://mongo:27017/lms
      REDIS_URL: redis://redis:6379
      JUDGE0_URL: http://judge0:2358
      WEB_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.main.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/lms
      REDIS_URL: redis://redis:6379
      JUDGE0_URL: http://judge0:2358
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mongo-data:
  judge0-db-data:
